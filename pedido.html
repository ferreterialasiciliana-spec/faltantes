<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pedido">
<meta name="theme-color" content="#f5a623">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="appleIcon">
<title>Pedido</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f18;--card:#161926;--card2:#1e2235;--border:#272d45;
  --orange:#f5a623;--orange2:#e8560b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;
  --text:#f0f2ff;--muted:#6b7499;--r:16px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:2px solid var(--orange);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;display:flex;align-items:center;gap:12px}
.hicon{width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  display:flex;align-items:center;justify-content:center;font-size:22px}
.htitle{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--orange);line-height:1}
.hsub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:8px;margin:12px 14px 0}
.navbtn{flex:1;text-align:center;text-decoration:none;padding:12px 4px;border-radius:12px;
  font-size:13px;font-weight:800;letter-spacing:.3px;
  background:var(--card2);border:1.5px solid var(--border);color:var(--muted)}
.navbtn.on{background:var(--orange);border-color:var(--orange);color:#000}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:14px;overflow:hidden}
.chead{background:var(--card2);border-bottom:1px solid var(--border);padding:12px 16px;
  font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.cbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--muted);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--card2);border:1.5px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-user-select:none;user-select:none}
.chip.on{background:var(--orange);border-color:var(--orange);color:#000}
.btn-row{display:flex;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
  cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  transition:transform .12s,opacity .15s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-add{flex:1;padding:16px 10px;font-size:17px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 4px 18px rgba(245,166,35,.35)}
.btn-pdf{width:100%;padding:18px;font-size:19px;
  background:linear-gradient(135deg,#b91c1c,var(--red));color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.3)}
.btn-tr{width:100%;padding:16px;font-size:17px;
  background:linear-gradient(135deg,#1e40af,var(--blue));color:#fff;box-shadow:0 4px 18px rgba(59,130,246,.3)}
.listwrap{margin:0 14px 14px}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.listtitle{font-size:18px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.badge{background:var(--orange);color:#000;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ithumb{width:46px;height:46px;border-radius:10px;flex-shrink:0;background:var(--card2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px}
.ibody{flex:1;min-width:0}
.idesc{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imeta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.inote{font-size:11px;color:var(--muted);font-style:italic;margin-top:3px}
.iqty{font-size:20px;font-weight:800;color:var(--orange);flex-shrink:0}
.iact{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.mini{border:1.5px solid var(--border);background:var(--card2);color:var(--text);border-radius:10px;
  padding:8px 10px;font-size:15px;font-weight:700;cursor:pointer;line-height:1}
.mini.tr{border-color:var(--blue);color:#7eb8f7}
.mini.del{border-color:var(--red);color:#fca5a5}
.mini:active{transform:scale(.92)}
.empty{text-align:center;padding:44px 20px;font-size:14px;color:var(--muted)}
.eicon{font-size:52px;display:block;margin-bottom:10px;opacity:.3}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;
  flex-direction:column;align-items:center;justify-content:center;gap:20px}
.overlay.show{display:flex}
.spinner{width:54px;height:54px;border:5px solid var(--border);border-top-color:var(--orange);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overmsg{color:var(--text);font-size:17px;font-weight:700;letter-spacing:.5px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(80px);background:var(--green);color:#fff;padding:13px 24px;
  border-radius:999px;font-size:14px;font-weight:700;z-index:400;pointer-events:none;
  transition:transform .28s ease;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.gap{height:12px}.gap2{height:28px}
</style>
</head>
<body>

<iframe name="estadoFrame" style="display:none"></iframe>

<div class="header">
  <div class="hicon">🧾</div>
  <div><div class="htitle">PEDIDO</div><div class="hsub">FALTANTES PENDIENTES</div></div>
</div>

<div class="nav">
  <a href="index.html" class="navbtn">➕ CARGA</a>
  <a href="pedido.html" class="navbtn on">🧾 PEDIDO</a>
  <a href="transito.html" class="navbtn">🚚 TRÁNSITO</a>
</div>

<div class="card">
  <div class="chead">📥 Filtros</div>
  <div class="cbody">
    <div class="field">
      <label>Filtrar por proveedor</label>
      <div class="chips" id="chipsProv"><span class="chip on">TODOS</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-add" id="btnCargarHoja" onclick="cargarDesdeHoja()">🔄 ACTUALIZAR DESDE HOJA</button>
    </div>
  </div>
</div>

<div class="listwrap">
  <div class="listhead">
    <span class="listtitle">PEDIDO / PENDIENTES</span>
    <span class="badge" id="badgeHoja">0</span>
  </div>
  <div id="listaHoja"><div class="empty"><span class="eicon">📥</span>Cargando faltantes...</div></div>
  <div class="gap"></div>
  <button class="btn btn-pdf" id="btnPDF" onclick="exportarPDF()" disabled>🧾 EXPORTAR PEDIDO EN PDF</button>
  <div class="gap"></div>
  <button class="btn btn-tr" id="btnTransito" onclick="marcarPedidoEnTransito()" disabled>🚚 MARCAR PEDIDO EN TRÁNSITO</button>
  <div class="gap2"></div>
</div>

<div class="overlay" id="overlay"><div class="spinner"></div><div class="overmsg" id="overmsg">Leyendo la hoja...</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWGPvsyKCRTjHLUFr6_eRINoHsZprJeCPlp9-4_NpqzwOA1hZJus_mFlCSNYA2_pk8/exec';
const SHEET_ID  = '1kesoqCbSH9c0F3ffs8gCQvNeB0ZvFXDSEndt3yvnUAg';
const SHEET_GID = '331274801';
const COL = { fecha:0, desc:1, cant:2, prov:3, nota:4, pedido:5, estado:6 };

const MODO = 'pendiente'; // esta pestaña muestra SOLO pendientes
let hojaRows = [];
let filtroProv = 'TODOS';
let leidoConScript = false;

function esTransito(est){ return (est||'').toString().toLowerCase().indexOf('transit') !== -1; }
function pasaModo(r){ return MODO === 'transito' ? esTransito(r.estado) : !esTransito(r.estado); }

async function cargarDesdeHoja() {
  const btn = document.getElementById('btnCargarHoja'); btn.disabled = true;
  document.getElementById('overmsg').textContent = 'Leyendo la hoja...';
  document.getElementById('overlay').classList.add('show');
  try {
    let filas = await leerViaScript();
    if (filas) { leidoConScript = true; } else { leidoConScript = false; filas = await leerViaGviz(); }
    hojaRows = (filas || []).filter(pasaModo);
    construirChipsProv(); renderHoja();
    toast(`✓ ${hojaRows.length} ítem${hojaRows.length!==1?'s':''}`);
  } catch (e) {
    toast('⚠️ No se pudo leer la hoja', true);
    document.getElementById('listaHoja').innerHTML =
      '<div class="empty"><span class="eicon">⚠️</span>No se pudo leer la hoja.</div>';
  } finally {
    document.getElementById('overlay').classList.remove('show'); btn.disabled = false;
  }
}

async function leerViaScript() {
  try {
    const res = await fetch(`${SCRIPT_URL}?accion=leer&_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    if (!Array.isArray(data)) return null;
    return data.map(r => ({
      fila: r.fila || null, fecha: r.fecha || '', desc: (r.desc||'').toString(),
      cant: (r.cant||'').toString(), prov: (r.prov||'').toString().trim() || 'SIN PROVEEDOR',
      nota: (r.nota||'').toString(), pedido: (r.pedido||'').toString(), estado: (r.estado||'').toString()
    })).filter(r => r.desc);
  } catch (e) { return null; }
}

async function leerViaGviz() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  const txt = await res.text();
  const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
  const rows = (json.table && json.table.rows) ? json.table.rows : [];
  const cell = c => c == null ? '' : (c.f != null && c.f !== '' ? String(c.f).trim() : (c.v != null ? String(c.v).trim() : ''));
  const out = [];
  rows.forEach(r => {
    const c = r.c || [];
    const desc = cell(c[COL.desc]); const estado = cell(c[COL.estado]);
    if (!desc || estado.toLowerCase().includes('recib')) return;
    out.push({ fila:null, fecha:cell(c[COL.fecha]), desc, cant:cell(c[COL.cant]),
      prov:cell(c[COL.prov])||'SIN PROVEEDOR', nota:cell(c[COL.nota]), pedido:cell(c[COL.pedido]), estado });
  });
  return out;
}

function construirChipsProv() {
  const cont = document.getElementById('chipsProv');
  const provs = [...new Set(hojaRows.map(r => r.prov))].sort();
  if (filtroProv !== 'TODOS' && !provs.includes(filtroProv)) filtroProv = 'TODOS';
  cont.innerHTML = '';
  ['TODOS', ...provs].forEach(p => {
    const el = document.createElement('span');
    el.className = 'chip' + (p === filtroProv ? ' on' : '');
    el.textContent = p === 'TODOS' ? `TODOS (${hojaRows.length})` : `${p} (${hojaRows.filter(r => r.prov === p).length})`;
    el.addEventListener('click', () => {
      filtroProv = p;
      cont.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      el.classList.add('on'); renderHoja();
    });
    cont.appendChild(el);
  });
}

function filasFiltradas() { return filtroProv === 'TODOS' ? hojaRows : hojaRows.filter(r => r.prov === filtroProv); }

function renderHoja() {
  const el = document.getElementById('listaHoja');
  const filas = filasFiltradas();
  document.getElementById('badgeHoja').textContent = filas.length;
  document.getElementById('btnPDF').disabled = !filas.length;
  document.getElementById('btnTransito').disabled = !filas.filter(r => r.fila).length;
  if (!filas.length) {
    el.innerHTML = '<div class="empty"><span class="eicon">📥</span>No hay pendientes para este proveedor.</div>';
    return;
  }
  el.innerHTML = filas.map(it => {
    let acciones = '';
    if (it.fila) {
      acciones = `<button class="mini tr" title="En tránsito" onclick="marcarUno(${it.fila},'EN TRANSITO')">🚚</button>
                  <button class="mini del" title="Borrar" onclick="borrarUno(${it.fila}, ${JSON.stringify(it.desc)})">🗑</button>`;
    }
    return `
    <div class="item">
      <div class="ithumb">📦</div>
      <div class="ibody">
        <div class="idesc">${it.desc}</div>
        <div class="imeta">
          <span>🏪 ${it.prov}</span>
          ${it.fecha ? `<span>🗓 ${it.fecha}</span>` : ''}
        </div>
        ${it.nota ? `<div class="inote">📝 ${it.nota}</div>` : ''}
      </div>
      <div class="iqty">${it.cant || '·'}</div>
      <div class="iact">${acciones}</div>
    </div>`;
  }).join('');
}

// ── Enviar acciones a la hoja (form+iframe) ──
function enviarAccion(params) {
  return new Promise(resolve => {
    const form = document.createElement('form');
    form.method = 'GET'; form.action = SCRIPT_URL; form.target = 'estadoFrame'; form.style.display = 'none';
    Object.keys(params).forEach(k => {
      const inp = document.createElement('input'); inp.type='hidden'; inp.name=k; inp.value=params[k]; form.appendChild(inp);
    });
    document.body.appendChild(form);
    const ifr = document.querySelector('iframe[name="estadoFrame"]');
    const t = setTimeout(() => { try{document.body.removeChild(form)}catch(e){}; resolve(); }, 6000);
    ifr.onload = () => { clearTimeout(t); try{document.body.removeChild(form)}catch(e){}; resolve(); };
    form.submit();
  });
}

async function aplicar(params, msg, etiqueta) {
  if (!leidoConScript) { toast('⚠️ Activá el Apps Script actualizado', true); return; }
  document.getElementById('overmsg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
  await enviarAccion(params);
  await new Promise(r => setTimeout(r, 900));
  await cargarDesdeHoja();
  toast(etiqueta);
}

function marcarUno(fila, estado) {
  aplicar({ accion:'estado', estado, filas: JSON.stringify([fila]) }, 'Actualizando...', '✓ Marcado en tránsito');
}

function borrarUno(fila, desc) {
  if (!leidoConScript) { toast('⚠️ Activá el Apps Script actualizado', true); return; }
  if (confirm(`¿Borrar "${desc}" de la hoja?\nEsto no se puede deshacer.`)) {
    aplicar({ accion:'borrar', fila: String(fila) }, 'Borrando...', '🗑 Producto borrado');
  }
}

function marcarPedidoEnTransito() {
  const filas = filasFiltradas().filter(r => r.fila).map(r => r.fila);
  if (!filas.length) { toast('No hay pendientes', true); return; }
  const txt = filtroProv === 'TODOS' ? 'todo el pedido' : `el pedido de ${filtroProv}`;
  if (confirm(`¿Marcar ${txt} (${filas.length} ítems) como EN TRÁNSITO?`)) {
    aplicar({ accion:'estado', estado:'EN TRANSITO', filas: JSON.stringify(filas) }, 'Actualizando...', '✓ Pedido en tránsito');
  }
}

function exportarPDF() {
  const filas = filasFiltradas();
  if (!filas.length) { toast('⚠️ Nada para exportar', true); return; }
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('⚠️ PDF no disponible (sin conexión)', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const hoy = new Date().toLocaleDateString('es-AR');
  const margenX = 40; let y = 48;
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('PEDIDO DE FALTANTES', margenX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110); y += 16;
  doc.text(`Fecha: ${hoy}`, margenX, y);
  doc.text(filtroProv === 'TODOS' ? 'Proveedor: TODOS' : `Proveedor: ${filtroProv}`, margenX + 200, y);
  doc.text(`Items: ${filas.length}`, margenX + 420, y);
  doc.setTextColor(0); y += 12;
  const grupos = {};
  filas.forEach(r => { (grupos[r.prov] = grupos[r.prov] || []).push(r); });
  Object.keys(grupos).sort().forEach(prov => {
    const body = grupos[prov].map(r => [r.cant || '', r.desc, r.nota || '']);
    doc.autoTable({
      startY: y + 16,
      head: [[{ content: prov + '   (' + grupos[prov].length + ')', colSpan: 3, styles: { halign: 'left' } }],
             ['CANT.', 'DESCRIPCION', 'NOTAS']],
      body: body, theme: 'grid',
      styles: { font: 'helvetica', fontSize: 10, cellPadding: 5, overflow: 'linebreak' },
      headStyles: { fillColor: [245,166,35], textColor: 0, fontStyle: 'bold' },
      columnStyles: { 0: { cellWidth: 55, halign: 'center' }, 2: { cellWidth: 150 } },
      margin: { left: margenX, right: margenX }
    });
    y = doc.lastAutoTable.finalY;
  });
  const nombre = filtroProv === 'TODOS' ? 'Pedido_TODOS' : 'Pedido_' + filtroProv.replace(/\s+/g,'_');
  doc.save(`${nombre}_${hoy.replace(/\//g,'-')}.pdf`);
  toast('🧾 PDF generado');
  const filasFila = filas.filter(r => r.fila).map(r => r.fila);
  if (leidoConScript && filasFila.length) {
    setTimeout(() => {
      if (confirm(`PDF generado. ¿Marcar estos ${filasFila.length} ítems como EN TRÁNSITO?`)) {
        aplicar({ accion:'estado', estado:'EN TRANSITO', filas: JSON.stringify(filasFila) }, 'Actualizando...', '✓ Pedido en tránsito');
      }
    }, 600);
  }
}

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast'+(err?' err':''); el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}

cargarDesdeHoja();
</script>
</body>
</html>
